[meta]
  [meta.name]
    full = "The Strategy Unit"
  [meta.link]
    home = "https://www.strategyunitwm.nhs.uk/"
    github = "https://github.com/The-Strategy-Unit"

[logo]
  small = "logos/logo_black_favicon.png"
  [logo.medium]
    light = "logos/logo_black_medium.png"
    dark = "logos/logo_yellow_medium.png"
  [logo.large]
    light = "logos/logo_black.svg"
    dark = "logos/logo_yellow.svg"

[color]
  foreground = "su-charcoal"
  background = "su-white"
  primary = "su-yellow"
  secondary = "dark-grey"
  info = "su-blue"

[color.palette]
  dark-grey = "#959595"
  su-charcoal = "#2c2825"
  su-yellow = "#f9bd07"
  su-white = "#f5f4f3"
  su-blue = "#5881c1"

[typography.base]
family = "Open Sans"
weight = 400

[typography.headings]
family = "Roboto Slab"
weight = 700

[typography.link]
color = "info"

[typography.strong]
weight = 700

[[typography.fonts]]
family = "Roboto Slab"
weights = [300, 700]

[[typography.fonts]]
family = "Open Sans"
weights = [400, 600, 700]